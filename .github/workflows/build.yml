name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Unzip project
        run: unzip -o RunningServicesApp.zip
      - name: Build
        run: gradle -p RunningServicesApp assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: RunningServices-debug
          path: RunningServicesApp/app/build/outputs/apk/debug/app-debug.apk
